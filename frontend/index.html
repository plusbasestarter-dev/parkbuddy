<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141e">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="ParkBuddy Poland — znajdź parking i wróć do swojego auta.">
<title>ParkBuddy Poland</title>
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<link rel="stylesheet" href="assets/styles.css?v=rc4">
<script defer src="assets/vendor/leaflet.js"></script>
<script type="module" src="assets/app.mjs?v=rc4"></script>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">PARK<b>BUDDY</b><span class="tag">POLAND</span></div><div class="headerActions"><select id="headerLanguage" class="languageSelect" data-label="language"><option value="pl">PL</option><option value="tr">TR</option><option value="en">EN</option></select><button id="themeToggle" class="iconbtn" data-action="toggleTheme" data-label="theme">☾</button><button class="iconbtn" data-action="locate" data-label="locate">⌖</button></div></header>
<div id="connectionNotice" class="notice" role="status" hidden data-i18n="offline"></div>
<section id="home" class="screen active" aria-labelledby="homeTitle">
<div class="eyebrow" id="cityLabel">WARSZAWA</div><h1 id="homeTitle" data-i18n="hero">Gdzie chcesz zaparkować?</h1><p data-i18n="intro"></p>
<label class="fieldlabel" for="citySelect" data-i18n="city"></label><select id="citySelect" class="input"></select>
<label class="fieldlabel" for="q" data-i18n="destination"></label><form id="homeSearch" class="search" role="search"><input id="q" class="input" maxlength="200" autocomplete="off" data-placeholder="searchPlaceholder" required><button class="primary" type="submit" data-label="search">→</button></form><div id="searchStatus" data-search-status class="inlineStatus" role="status"></div>
<div id="homeSearchResults" class="searchResults" aria-live="polite"></div><div class="quickgrid"><button class="quick" data-go="explore">⌖<b data-i18n="map"></b></button><button class="quick" data-go="car">▣<b data-i18n="car"></b></button></div>
<div class="sectionhead"><h3 data-i18n="cityOptions"></h3><small id="parkingCount"></small></div><p class="helper" data-i18n="homeHint"></p><p id="homeCacheNotice" class="helper" role="status"></p><div id="homeParkingList" class="card flat" aria-live="polite"></div>
</section>
<section id="explore" class="screen" aria-labelledby="exploreTitle">
<div class="head"><h2 id="exploreTitle"></h2></div><div class="chips filters"><button class="chip on" data-filter="all" data-i18n="all" aria-pressed="true"></button><button class="chip" data-filter="park_and_ride" aria-pressed="false">P+R</button><button class="chip" data-filter="structured" data-i18n="structured" aria-pressed="false"></button><button class="chip" data-filter="surface" data-i18n="surface" aria-pressed="false"></button></div>
<div class="mapwrap"><div id="mapbox" class="map" data-label="mapLabel"></div><p class="mapMessage" id="mapboxMessage" role="status" hidden></p></div><label class="fieldlabel" for="exploreQ" data-i18n="destination"></label><form id="exploreSearch" class="search" role="search"><input id="exploreQ" class="input" maxlength="200" data-placeholder="searchPlaceholder" required><button type="submit" class="primary" data-label="search">→</button></form><div data-search-status class="inlineStatus" role="status"></div><div id="exploreSearchResults" class="searchResults" aria-live="polite"></div>
</section>
<section id="choices" class="screen" aria-labelledby="choicesTitle">
<div class="head"><button class="back" data-action="back" data-label="back">‹</button><h2 id="choicesTitle" data-i18n="planTitle"></h2></div><div class="card flat"><b id="choiceDest"></b><p class="helper" data-i18n="noLive"></p></div><div id="choicesNotice" class="inlineStatus" role="status"></div><div id="decisionPlan"></div><div id="nearbyList"></div>
</section>
<section id="detail" class="screen" aria-labelledby="detailTitle"><div class="head"><button class="back" data-action="back" data-label="back">‹</button><h2 id="detailTitle" data-i18n="details"></h2></div><div id="detailContent"></div></section>
<section id="route" class="screen" aria-labelledby="routeTitle">
<div class="head"><button class="back" data-action="back" data-label="back">‹</button><h2 id="routeTitle" data-i18n="drive"></h2></div><div class="mapwrap"><div id="routeMap" class="map smallmap" data-label="mapLabel"></div><p id="routeMapMessage" class="mapMessage" role="status" hidden></p></div><div class="card flat"><b id="placeName"></b><p id="routeInfo" role="status"></p><p class="helper" data-i18n="routeOverview"></p></div><a id="externalRoute" class="outline full buttonLink" target="_blank" rel="noopener noreferrer" data-i18n="external"></a><button class="primary full gapTop" id="routeSave" data-action="saveGPS" data-i18n="parked"></button><p class="attribution"><span data-i18n="routeProvider"></span> · <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener noreferrer" data-i18n="mapAttribution"></a></p>
</section>
<section id="car" class="screen" aria-labelledby="carTitle">
<div class="head"><button class="back" data-action="back" data-label="back">‹</button><h2 id="carTitle" data-i18n="car"></h2></div><div id="carEmpty" class="card flat emptyState"><div class="emptyCarIcon" aria-hidden="true">▣</div><h3 data-i18n="carEmpty"></h3><p data-i18n="carEmptyHint"></p></div><div id="carMapWrap" class="mapwrap" hidden><div id="carMap" class="map smallmap" data-label="mapLabel"></div><p id="carMapMessage" class="mapMessage" role="status" hidden></p></div><div id="carInfo" class="card flat" hidden></div><div id="carSyncStatus" class="inlineStatus" role="status"></div>
<div id="carPicking" hidden><p data-i18n="pickHint"></p><button class="ghost full gapTop" data-action="useMapCenter" data-i18n="useMapCenter"></button><button id="saveSelected" class="primary full" data-action="saveSelected" data-i18n="saveSelected" disabled></button><button class="ghost full gapTop" data-action="cancelPick" data-i18n="cancel"></button></div>
<div id="carActions"><button id="findCar" class="primary full" data-action="findCar" data-i18n="findCar" hidden></button><button class="outline full gapTop" data-action="saveGPS" data-i18n="saveGPS"></button><button class="ghost full gapTop" data-action="pickCar" data-i18n="saveMap"></button><button id="deleteCar" class="danger full gapTop" data-action="deleteCar" data-i18n="deleteCar" hidden></button></div>
</section>
<section id="profile" class="screen" aria-labelledby="profileTitle">
<h2 id="profileTitle" data-i18n="profile"></h2><div class="card flat">
<div class="setting"><label for="languageSelect" data-i18n="language"></label><select id="languageSelect" class="input"><option value="pl">Polski</option><option value="tr">Türkçe</option><option value="en">English</option></select></div>
<div class="setting"><b data-i18n="theme"></b><div class="chips"><button class="chip" data-theme-choice="light" data-i18n="light"></button><button class="chip" data-theme-choice="dark" data-i18n="dark"></button><button class="chip" data-theme-choice="system" data-i18n="system"></button></div></div>
<div class="setting"><label for="prefSelect" data-i18n="priority"></label><select id="prefSelect" class="input"><option value="balanced" data-i18n="balanced"></option><option value="near" data-i18n="near"></option><option value="capacity" data-i18n="capacityPref"></option><option id="cheapOption" value="cheap" data-i18n="cheap"></option></select><small id="preferenceNotice"></small></div>
<div class="setting"><label for="walkSelect" data-i18n="maxWalk"></label><small data-i18n="walkSettingHint"></small><select id="walkSelect" class="input"><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option></select></div>
<div class="setting"><label for="budgetSelect" data-i18n="budget"></label><small data-i18n="budgetHint"></small><select id="budgetSelect" class="input"><option value="0" data-i18n="unlimited"></option><option value="5">5 PLN</option><option value="10">10 PLN</option><option value="15">15 PLN</option></select><small id="priceCoverage"></small></div>
<div class="setting"><label for="vehicleSelect" data-i18n="vehicle"></label><small data-i18n="vehicleHint"></small><select id="vehicleSelect" class="input"><option value="standard" data-i18n="standard"></option><option value="large" data-i18n="large"></option></select></div></div>
<div class="card blue"><h3 data-i18n="privacy"></h3><p data-i18n="privacyText"></p><p data-i18n="privacyServices"></p><a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener noreferrer">FOSSGIS / OpenStreetMap</a><div class="twoBtns"><button class="ghost" data-action="deleteCar" data-i18n="deleteCar"></button><button class="danger" data-action="reset" data-i18n="reset"></button></div></div><p class="helper version">ParkBuddy · <span id="version"></span></p>
</section>
<nav class="nav" aria-label="Navigation"><button data-go="home" class="active"><strong aria-hidden="true">⌂</strong><span data-i18n="home"></span></button><button data-go="explore"><strong aria-hidden="true">⌖</strong><span data-i18n="explore"></span></button><button data-go="car"><strong aria-hidden="true">▣</strong><span data-i18n="car"></span></button><button data-go="profile"><strong aria-hidden="true">☰</strong><span data-i18n="profile"></span></button></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div><noscript>ParkBuddy wymaga JavaScript. ParkBuddy requires JavaScript.</noscript>
</main>
</body>
</html>
